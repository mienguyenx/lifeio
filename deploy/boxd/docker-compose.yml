# LifeOS on boxd.sh — one machine, one domain (https://<vm>.boxd.sh -> port 8000)
# Usage (on the machine, from repo root):  docker compose -f deploy/boxd/docker-compose.yml --env-file deploy/boxd/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos}
    volumes:
      - lifeos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lifeos} -d ${POSTGRES_DB:-lifeos}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifeos}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-LifeOS}
    expose:
      - '4000'

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_URL: /api/v1   # same origin; nginx proxies /api -> backend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8000:80'

volumes:
  lifeos-db:
